<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tornadion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1700eb">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #9fd3ea; touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .txt, .panel { text-shadow: 0 2px 0 rgba(0,0,0,.45); }
  .panel { background: rgba(10,14,30,.45); border-radius: 10px; padding: 6px 10px; }
  #stats { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left)); width: 150px; font-size: 14px; }
  .bar { height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; margin: 2px 0 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; }
  #hp i { background: #4cd964; } #fuel i { background: #ffb020; } #xp i { background: #6fa8ff; }
  #tinfo { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 16px; white-space: nowrap; }
  #toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
  #toasts div { background: rgba(10,14,30,.6); padding: 5px 12px; border-radius: 14px; font-size: 16px; transition: opacity .6s; }
  #speed { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 34px; pointer-events: none; text-align: center; }
  #speed small { font-size: 14px; } #wind { font-size: 14px; display: block; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .3s; }
  #scope { position: fixed; inset: 0; pointer-events: none; display: none; background: radial-gradient(circle at 50% 50%, transparent 38vmin, #000 39vmin); }
  #stick-zone { position: fixed; left: 0; top: 0; bottom: 0; width: 50%; }
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); background: rgba(10,14,30,.22); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px; border-radius: 50%; background: rgba(255,255,255,.9); }
  #btns { position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom)); width: 250px; height: 230px; pointer-events: none; }
  .btn { position: absolute; pointer-events: auto; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); color: #fff; font: inherit; font-size: 13px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); touch-action: none; background: rgba(40,50,90,.75); text-shadow: 0 1px 0 #0008; }
  .btn.on { transform: translateY(3px) scale(.94); filter: brightness(1.3); }
  #b-boost { right: 0; bottom: 0; width: 88px; height: 88px; background: #ff8a1f; font-size: 16px; }
  #b-brake { right: 98px; bottom: 0; width: 70px; height: 70px; background: #e63946; }
  #b-probe { right: 0; bottom: 100px; width: 62px; height: 62px; background: #1fa39a; }
  #b-anchor { right: 72px; bottom: 84px; width: 62px; height: 62px; background: #6c7080; }
  #b-photo { right: 176px; bottom: 0; width: 58px; height: 58px; }
  #b-zoom { right: 144px; bottom: 80px; width: 56px; height: 56px; }
  #b-horn { right: 0; bottom: 172px; width: 50px; height: 50px; font-size: 11px; }
  #b-anchor.act { background: #1700eb; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="scope"></div>
<div id="stats" class="panel">
  <div><span id="money">$0</span> · <span id="level">Lv 1</span> · <span id="clock"></span></div>
  <div class="bar" id="xp"><i></i></div>
  HEALTH<div class="bar" id="hp"><i></i></div>
  FUEL<div class="bar" id="fuel"><i></i></div>
  <span id="probes"></span>
</div>
<div id="tinfo" class="panel">Waiting for storms…</div>
<div id="toasts"></div>
<div id="speed" class="txt">0<small>mph</small><span id="wind"></span></div>
<div id="stick-zone"></div>
<div id="stick"><div id="knob"></div></div>
<div id="btns">
  <button class="btn" id="b-boost">BOOST</button>
  <button class="btn" id="b-brake">BRAKE</button>
  <button class="btn" id="b-probe">PROBE</button>
  <button class="btn" id="b-anchor">ANCHOR</button>
  <button class="btn" id="b-photo">PHOTO</button>
  <button class="btn" id="b-zoom">ZOOM</button>
  <button class="btn" id="b-horn">HORN</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
